[versions]
kotlin = "2.3.20"
kotlinxSerialization = "1.8.0"
kotlinxCoroutines = "1.10.2"
grpc = "1.69.0"
grpcKotlin = "1.3.0"
protobuf = "4.29.1"
protobufPlugin = "0.9.4"
slf4j = "2.0.16"
logback = "1.5.12"
junit = "5.11.3"
kotlinTestVersion = "2.3.20"

[libraries]
kotlin-stdlib                   = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect                  = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

kotlinx-serialization-json      = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-jdk8         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8", version.ref = "kotlinxCoroutines" }

grpc-stub                       = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf                   = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-netty-shaded               = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-inprocess                  = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
grpc-kotlin-stub                = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpcKotlin" }
grpc-services                   = { module = "io.grpc:grpc-services", version.ref = "grpc" }

protobuf-kotlin                 = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }
protobuf-java                   = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util              = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }

slf4j-api                       = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic                 = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-jupiter-api               = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine            = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher         = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.3" }
kotlin-test                     = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlinTestVersion" }
kotlin-test-junit5              = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlinTestVersion" }

[bundles]
kotlinx                         = ["kotlinx-serialization-json", "kotlinx-coroutines-core", "kotlinx-coroutines-jdk8"]
grpc-runtime                    = ["grpc-stub", "grpc-protobuf", "grpc-kotlin-stub", "protobuf-kotlin", "protobuf-java", "protobuf-java-util"]
grpc-server                     = ["grpc-netty-shaded", "grpc-services"]
test-kit                        = ["junit-jupiter-api", "junit-jupiter-engine", "kotlin-test", "kotlin-test-junit5", "junit-platform-launcher"]
logging                         = ["slf4j-api", "logback-classic"]

[plugins]
kotlin-jvm                      = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization            = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
protobuf                        = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
