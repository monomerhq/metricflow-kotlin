name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Verify the tag matches the Maven version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(./gradlew -q printVersion)"

      - name: Verify the public repository and product bundle
        run: ./gradlew verifyPublicRepository --no-daemon

      - name: Attest the immutable product bundle
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.2
        with:
          subject-path: build/bundles/metricflow-monomer-product-*.zip

      - name: Create the GitHub release and upload immutable evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(./gradlew -q printVersion)"
          archive="build/bundles/metricflow-monomer-product-${version}.zip"
          gh release create "$RELEASE_TAG" \
            "$archive" \
            "${archive}.sha256" \
            --verify-tag \
            --title "metricflow-kotlin ${version}" \
            --generate-notes
